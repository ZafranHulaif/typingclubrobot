name: v4-windows

# Cek build v4 di mesin Windows asli setiap push: app native Flutter
# (JS verbatim cocok dgn Python, analyze, tes, build windows dgn host
# WebView2 C++). Hasil build disimpan sebagai artifact supaya bisa
# diunduh & dicoba. Job sidecar = jalur lama (diparkir), tetap dicek.
on:
  push:
    branches: [v4]
  workflow_dispatch:

jobs:
  sidecar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kompilasi semua modul python
        run: python -W error::SyntaxWarning -m compileall -q sidecar engine net gui bot_gui.py autopilot_pw.py paths.py
      - name: Tes protokol sidecar
        run: python -X utf8 -m sidecar.test_protocol

  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: JS init cocok dengan sumber Python
        run: python ui/tool/gen_js.py --check
      - name: Analyze
        working-directory: ui
        run: |
          flutter pub get
          flutter analyze
      - name: Tes
        working-directory: ui
        run: flutter test
      - name: Build windows
        working-directory: ui
        # TB_LICENSE_SECRET (secret repo, opsional) = rahasia kunci manual
        # lama; tanpa itu kunci HMAC lama tidak dikenali (token online aman)
        env:
          TB_LICENSE_SECRET: ${{ secrets.TB_LICENSE_SECRET }}
        run: flutter build windows --release "--dart-define=TB_LICENSE_SECRET=$env:TB_LICENSE_SECRET"
      - uses: actions/upload-artifact@v4
        with:
          name: typingbot-ui-windows
          path: ui/build/windows/x64/runner/Release
      # N6: satu TypingBot.exe = pembawa (launcher/) + zip folder app. Ini
      # aset rilis: updater 3.5.x mengganti exe lama dengannya, unduhan baru
      # cukup satu file. Diuji pasang ke LOCALAPPDATA sementara.
      - name: Bundel TypingBot.exe
        shell: pwsh
        run: |
          cmake -S launcher -B build-launcher -A x64
          cmake --build build-launcher --config Release
          $v = (Select-String -Path ui/lib/src/version.dart -Pattern "appVersion = '([^']+)'").Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          ./launcher/pack.ps1 -Launcher build-launcher/Release/TypingBotSetup.exe -AppDir ui/build/windows/x64/runner/Release -Version $v -Out dist/TypingBot.exe
          # uji: pasang ke folder sementara, tanpa membuka app
          $tmp = Join-Path $env:RUNNER_TEMP 'tb-install'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $env:LOCALAPPDATA = $tmp
          $env:TB_SETUP_NO_LAUNCH = '1'
          $env:TB_SETUP_SILENT = '1'
          # 3.5.x: shortcut Start Menu menunjuk ke salinan lama di folder lain
          $old = Join-Path $env:RUNNER_TEMP 'tb-lama'
          New-Item -ItemType Directory -Force $old | Out-Null
          Set-Content (Join-Path $old 'TypingBot (2).exe') 'x'
          Set-Content (Join-Path $old 'TypingBot (2).exe.new.exe') 'x'
          $lnkPath = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\TypingBot.lnk'
          $ws = New-Object -ComObject WScript.Shell
          $l = $ws.CreateShortcut($lnkPath); $l.TargetPath = (Join-Path $old 'TypingBot (2).exe'); $l.Save()
          $p = Start-Process -FilePath dist/TypingBot.exe -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$tmp/TypingBot/setup.log" -ErrorAction SilentlyContinue; throw "pasang gagal: $($p.ExitCode)" }
          if ((Get-ChildItem $old).Count -ne 0) { throw "folder lama tidak dibersihkan: $(Get-ChildItem $old | ForEach-Object Name)" }
          if ($ws.CreateShortcut($lnkPath).TargetPath -notlike '*tb-install*TypingBot*app*TypingBot.exe') { throw "shortcut tidak diarahkan ke app: $($ws.CreateShortcut($lnkPath).TargetPath)" }
          $app = "$tmp/TypingBot/app"
          if (-not (Test-Path "$app/TypingBot.exe")) { throw 'app/TypingBot.exe tidak ada' }
          if (-not (Test-Path "$app/vcruntime140.dll")) { throw 'vcruntime ikut dibawa?' }
          $iv = (Get-Content "$app/version.txt" -Raw).Trim()
          if ($iv -ne $v) { throw "version.txt $iv != $v" }
          # sisa updater 3.5.x di folder yang sama dibersihkan, file lain aman
          foreach ($f in 'TypingBot (1).exe', 'TypingBot.exe.new.exe.new.exe', 'TypingBot.exe.new.exe.part', '_update.cmd', 'catatan.txt') { Set-Content (Join-Path dist $f) 'x' }
          # jalan kedua: sudah terpasang, tidak memasang ulang
          $stamp = (Get-Item "$app/TypingBot.exe").LastWriteTimeUtc
          $p = Start-Process -FilePath dist/TypingBot.exe -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'jalan kedua gagal' }
          if ((Get-Item "$app/TypingBot.exe").LastWriteTimeUtc -ne $stamp) { throw 'terpasang ulang padahal versi sama' }
          $sisa = Get-ChildItem dist | ForEach-Object Name
          if (($sisa | Where-Object { $_ -ne 'TypingBot.exe' -and $_ -ne 'catatan.txt' }).Count -gt 0) { throw "sisa tidak dibersihkan: $sisa" }
          if (-not (Test-Path dist/catatan.txt)) { throw 'file lain ikut terhapus' }
          Remove-Item dist/catatan.txt
          # versi terpasang lebih lama -> diperbarui
          Set-Content "$app/version.txt" '3.9.0'
          $p = Start-Process -FilePath dist/TypingBot.exe -ArgumentList '--update' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'pembaruan gagal' }
          if ((Get-Content "$app/version.txt" -Raw).Trim() -ne $v) { throw 'version.txt tidak diperbarui' }
          if (Test-Path "$tmp/TypingBot/app.old") { throw 'app.old tertinggal' }
          # pembaruan dari dalam app: pemasang mewarisi folder kerja = folder
          # app (4.0.2 live: "TypingBot masih terbuka", folder tak bisa ditukar)
          Set-Content "$app/version.txt" '3.9.0'
          Copy-Item dist/TypingBot.exe "$tmp/TypingBot/upd.exe"
          $p = Start-Process -FilePath "$tmp/TypingBot/upd.exe" -ArgumentList '--update' -WorkingDirectory $app -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$tmp/TypingBot/setup.log" -ErrorAction SilentlyContinue; throw 'pembaruan dari folder app gagal' }
          if ((Get-Content "$app/version.txt" -Raw).Trim() -ne $v) { throw 'version.txt tidak diperbarui (folder kerja app)' }
          Remove-Item "$tmp/TypingBot/upd.exe"
          Write-Host "bundel OK ($v)"
      - uses: actions/upload-artifact@v4
        with:
          name: typingbot-setup
          path: dist/TypingBot.exe
      # Uji mandiri: jalankan app (TB_SELFTEST), app melakukan langkah UI
      # sendiri, skrip ini memotret layar tiap langkah. Hasil (png +
      # bot.log) = artifact 'selftest'. Tidak menggagalkan build.
      - name: Uji mandiri (screenshot)
        working-directory: ui
        shell: pwsh
        continue-on-error: true
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'selftest'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $env:TB_SELFTEST = $dir
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($path) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $p = Start-Process -FilePath 'build\windows\x64\runner\Release\TypingBot.exe' -PassThru
          $sw = [Diagnostics.Stopwatch]::StartNew()
          while ($sw.Elapsed.TotalSeconds -lt 300 -and -not (Test-Path (Join-Path $dir 'selesai'))) {
            Get-ChildItem $dir -Filter *.ready | ForEach-Object {
              $done = Join-Path $dir ($_.BaseName + '.done')
              if (-not (Test-Path $done)) {
                Shot (Join-Path $dir ($_.BaseName + '.png'))
                Set-Content $done 'ok'
              }
            }
            Start-Sleep -Milliseconds 300
          }
          if (-not (Test-Path (Join-Path $dir 'selesai'))) { Shot (Join-Path $dir 'zz-timeout.png') }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Copy-Item (Join-Path $env:LOCALAPPDATA 'TypingBot\bot.log') $dir -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: ${{ runner.temp }}/selftest
          if-no-files-found: ignore
