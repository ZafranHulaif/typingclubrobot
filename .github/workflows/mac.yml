name: mac

# Versi macOS (cabang mac): build app WKWebView + uji mandiri di Mac asli
# GitHub. Uji = halaman lokal dgn iframe LINTAS ORIGIN (ui/tool/mactest),
# cek ketikan & klik sampai sebagai input asli (isTrusted), kuki, reload.
# Tanpa akun edclub (kredensial tidak ditaruh di CI).
on:
  push:
    # mac-live = uji live dgn akun tes (token CI tidak bisa dispatch)
    branches: [mac, mac-live]
  workflow_dispatch:
    inputs:
      live:
        description: "Uji live dgn akun tes (butuh jabat tangan sesi terenkripsi)"
        type: boolean
        default: false
      detik:
        description: "Lama bot jalan (detik)"
        default: "180"

jobs:
  macos:
    if: ${{ !inputs.live && github.ref != 'refs/heads/mac-live' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze
        working-directory: ui
        run: |
          flutter pub get
          flutter analyze
      - name: Tes
        working-directory: ui
        run: flutter test
      - name: Build macos
        working-directory: ui
        run: flutter build macos --release
      - name: Uji mandiri (webview + peniru CDP)
        run: |
          set -x
          cd ui/tool/mactest
          python3 -m http.server 8701 --bind 127.0.0.1 >/tmp/srv1.log 2>&1 &
          python3 -m http.server 8702 --bind 127.0.0.1 >/tmp/srv2.log 2>&1 &
          cd -
          sleep 2
          curl -sf http://127.0.0.1:8701/main.html >/dev/null
          curl -sf http://localhost:8702/frame.html >/dev/null
          APP=$(ls -d ui/build/macos/Build/Products/Release/*.app | head -1)
          echo "app: $APP"
          OUT=$PWD/mactest-out
          mkdir -p "$OUT"
          TB_MACTEST="$OUT" TB_MACTEST_URL=http://127.0.0.1:8701/main.html \
            "$APP/Contents/MacOS/TypingBot" >"$OUT/stdout.txt" 2>&1 &
          PID=$!
          for i in $(seq 1 90); do
            [ -f "$OUT/selesai" ] && break
            [ $i -eq 20 ] && screencapture -x "$OUT/layar-20s.png" || true
            sleep 1
          done
          screencapture -x "$OUT/layar-akhir.png" || true
          kill $PID || true
          cat "$OUT/result.json" || echo "TIDAK ADA result.json"
          cat "$OUT/log.txt" || true
          tail -50 "$OUT/stdout.txt" || true
      - name: Periksa hasil
        run: |
          python3 - <<'EOF'
          import json, sys
          r = json.load(open('mactest-out/result.json'))
          gagal = []
          def cek(nama, ok):
              print(('OK   ' if ok else 'GAGAL'), nama)
              if not ok: gagal.append(nama)
          cek('tanpa error', 'error' not in r)
          cek('iframe lintas origin terlihat', r.get('iframe_found') is True)
          cek('eval di iframe', r.get('eval_iframe') == 'http://localhost:8702')
          t = r.get('iframe_typing') or {}
          keys = t.get('keys') or []
          cek('teks terketik di iframe', t.get('text') == 'Hello Worl')
          cek('semua tombol isTrusted', bool(keys) and all(k.get('trusted') for k in keys))
          cek('huruf besar terketik', any(k.get('k') == 'H' for k in keys))
          m = (r.get('main_after_click') or {}).get('clicks') or []
          cek('klik utama isTrusted', bool(m) and all(c.get('trusted') for c in m))
          f = r.get('iframe_after_click') or []
          cek('klik di iframe isTrusted', bool(f) and all(c.get('trusted') for c in f))
          cek('kuki tersimpan', r.get('cookie') == ['ok123'])
          cek('frame ada lagi sesudah reload', any('frame.html' in u for u in r.get('after_reload_frames') or []))
          sys.exit(1 if gagal else 0)
          EOF
      # App ASLI (UI Flutter + halaman edclub tanpa login): potret tiap
      # langkah uji mandiri biasa (selftest.dart) spt CI Windows.
      - name: Uji app asli (potret layar)
        if: always()
        run: |
          APP=$(ls -d ui/build/macos/Build/Products/Release/*.app | head -1)
          OUT=$PWD/mactest-out/app
          mkdir -p "$OUT"
          TB_SELFTEST="$OUT" "$APP/Contents/MacOS/TypingBot" >"$OUT/stdout.txt" 2>&1 &
          PID=$!
          for i in $(seq 1 200); do
            for r in "$OUT"/*.ready; do
              [ -e "$r" ] || continue
              n=$(basename "$r" .ready)
              [ -e "$OUT/$n.done" ] && continue
              screencapture -x "$OUT/$n.png" || true
              touch "$OUT/$n.done"
            done
            [ -f "$OUT/selesai" ] && break
            sleep 0.5
          done
          screencapture -x "$OUT/akhir.png" || true
          kill $PID || true
          cat "$OUT/error.txt" 2>/dev/null || true
          ls "$OUT"
          LOG="$HOME/Library/Application Support/TypingBot/bot.log"
          [ -f "$LOG" ] && tail -60 "$LOG" && cp "$LOG" "$OUT/bot.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mactest-out
          path: mactest-out
      - name: Kemas app (zip)
        if: always()
        run: |
          cd ui/build/macos/Build/Products/Release
          ditto -c -k --keepParent TypingBot.app ../../../../../../TypingBot-mac.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typingbot-mac
          path: TypingBot-mac.zip

  # Uji LIVE dgn akun tes edclub. Sesi (kuki rt) TIDAK pernah ada dalam
  # bentuk terbaca di repo/log: job membuat kunci sekali pakai, pemilik
  # mengirim sesi terenkripsi ke kunci itu lewat cabang mac-live-sesi,
  # sesi yang sudah berputar dikirim balik terenkripsi ke kunci penerima
  # (tool/mactest/kunci_penerima.pem; kunci privatnya hanya di VPS).
  live:
    if: ${{ inputs.live || github.ref == 'refs/heads/mac-live' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build macos
        working-directory: ui
        run: |
          flutter pub get
          flutter build macos --release
      - name: Kunci sekali pakai
        run: |
          mkdir -p kunci
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/k.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/k.pem" -pubout -out kunci/pub.pem
      - uses: actions/upload-artifact@v4
        with:
          name: kunci-sekali
          path: kunci/pub.pem
      - name: Tunggu sesi terenkripsi
        run: |
          F="sesi-${{ github.run_id }}.enc"
          D="$HOME/Library/Application Support/TypingBot/wv2profile"
          mkdir -p "$D"
          for i in $(seq 1 90); do
            if git fetch -q origin mac-live-sesi 2>/dev/null && git cat-file -e "FETCH_HEAD:$F" 2>/dev/null; then
              git show "FETCH_HEAD:$F" | base64 -d | openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/k.pem" \
                -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 > "$D/tb_sesi.json"
              rm -f "$RUNNER_TEMP/k.pem"
              python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('sesi ok, kunci:', sorted(d))" "$D/tb_sesi.json"
              exit 0
            fi
            sleep 10
          done
          echo "sesi tidak datang"; exit 1
      - name: Jalankan app + bot (live)
        run: |
          APP=$(ls -d ui/build/macos/Build/Products/Release/*.app | head -1)
          OUT=$PWD/live-out
          mkdir -p "$OUT"
          TB_SELFTEST="$OUT" TB_SELFTEST_RUN="${{ inputs.detik || '180' }}" "$APP/Contents/MacOS/TypingBot" >"$OUT/stdout.txt" 2>&1 &
          PID=$!
          for i in $(seq 1 1600); do
            for r in "$OUT"/*.ready; do
              [ -e "$r" ] || continue
              n=$(basename "$r" .ready)
              [ -e "$OUT/$n.done" ] && continue
              screencapture -x "$OUT/$n.png" || true
              touch "$OUT/$n.done"
            done
            [ -f "$OUT/selesai" ] && break
            sleep 0.5
          done
          sleep 5
          screencapture -x "$OUT/akhir.png" || true
          kill $PID || true
          sleep 2
          cat "$OUT/error.txt" 2>/dev/null || true
          LOG="$HOME/Library/Application Support/TypingBot/bot.log"
          [ -f "$LOG" ] && cp "$LOG" "$OUT/bot.log" && tail -80 "$LOG" || true
      - name: Kirim balik sesi (terenkripsi)
        if: always()
        run: |
          D="$HOME/Library/Application Support/TypingBot/wv2profile/tb_sesi.json"
          mkdir -p sesi-baru
          [ -f "$D" ] && openssl pkeyutl -encrypt -pubin -inkey ui/tool/mactest/kunci_penerima.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$D" | base64 > sesi-baru/sesi.enc || true
          rm -f "$D"
          ls -la sesi-baru
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sesi-baru
          path: sesi-baru
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-out
          path: live-out
