<!doctype html>
<html><head><meta charset="utf-8"><title>frame</title></head><body style="font:16px sans-serif">
<p>iframe lintas origin (mirip lesson edclub)</p>
<input id="ketik" style="width:400px;height:30px">
<button id="b2" style="width:120px;height:40px">klik frame</button>
<script>
window.hasil = {keys: [], clicks: [], text: ''};
const i = document.getElementById('ketik');
i.addEventListener('keydown', (e) => hasil.keys.push({k: e.key, code: e.code, trusted: e.isTrusted, shift: e.shiftKey}));
i.addEventListener('input', () => { hasil.text = i.value; });
document.getElementById('b2').addEventListener('click', (e) => hasil.clicks.push({trusted: e.isTrusted}));
</script>
</body></html>
